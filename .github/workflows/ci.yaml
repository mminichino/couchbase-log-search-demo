name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint charts
        run: |
          for c in charts/00-operators charts/10-platform charts/20-apps; do
            echo "helm lint $c"
            helm lint "$c"
          done

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # generator-test and discover-test jobs are added in phases 8 and 10.

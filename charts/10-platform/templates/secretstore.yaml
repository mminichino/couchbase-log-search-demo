{{- if .Values.secretStore.enabled }}
{{- if eq .Values.secretStore.kind "SecretStore" }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secretStore.name }}
  labels:
    {{- include "logdemo-platform.labels" . | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.secretStore.projectID | quote }}
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: {{ .Values.secretStore.serviceAccountName }}
{{- end }}
{{- end }}

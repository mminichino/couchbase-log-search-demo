{{- if and .Values.couchbase.enabled .Values.couchbase.init.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: cb-logdemo-init
  labels:
    {{- include "logdemo-platform.labels" . | nindent 4 }}
  annotations:
    # Re-run on upgrade by bumping this value in values when scripts change.
    logdemo.couchbase.com/init-revision: {{ .Values.couchbase.init.revision | quote }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cb-logdemo-init
        app.kubernetes.io/part-of: logdemo
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: {{ .Values.couchbase.init.image | quote }}
          command: ["/bin/sh", "/config/init.sh"]
          env:
            - name: CB_HOST
              value: {{ .Values.couchbase.clusterName | quote }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: admin
              mountPath: /secrets/admin
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: cb-logdemo-init
            defaultMode: 0755
        - name: admin
          secret:
            secretName: {{ .Values.couchbase.adminSecret }}
{{- end }}

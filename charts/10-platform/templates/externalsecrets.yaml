{{- if .Values.secretStore.enabled }}
{{- $storeKind := .Values.secretStore.kind -}}
{{- $storeName := .Values.secretStore.name -}}
{{- if eq $storeKind "ClusterSecretStore" }}
{{- $storeName = .Values.secretStore.clusterStoreName -}}
{{- end }}
{{- range .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  labels:
    {{- include "logdemo-platform.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: {{ $storeKind }}
    name: {{ $storeName }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    {{- if .template }}
    template:
      engineVersion: v2
      data:
        {{- range $k, $v := .template }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
    {{- end }}
  data:
    {{- if .template }}
    - secretKey: password
      remoteRef:
        key: {{ .remoteKey }}
    {{- else }}
    - secretKey: {{ .secretKey | default "password" }}
      remoteRef:
        key: {{ .remoteKey }}
    {{- end }}
{{- end }}
{{- end }}

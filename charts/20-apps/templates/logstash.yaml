{{- if .Values.logstash.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
  labels:
    {{- include "logdemo-apps.labels" . | nindent 4 }}
    app.kubernetes.io/component: logstash
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    xpack.monitoring.enabled: false
    pipeline.ecs_compatibility: disabled
  pipelines.yml: |
    - pipeline.id: main
      path.config: "/usr/share/logstash/pipeline/logstash.conf"
  logstash.conf: |
    input {
      tcp {
        port => {{ .Values.logstash.port }}
        # line + json filter (not json_lines) so the event "host" from the
        # payload overwrites the TCP client address Logstash would otherwise keep.
        codec => line
      }
    }
    filter {
      # line codec stores the payload in [message]; rename before json parse
      # so remove_field does not drop the event's own "message" property.
      mutate {
        rename => { "message" => "[@metadata][raw]" }
      }
      json {
        source => "[@metadata][raw]"
        remove_field => ["[@metadata][raw]"]
      }
      mutate {
        remove_field => ["@version", "@timestamp", "port"]
      }
    }
    output {
      kafka {
        bootstrap_servers => {{ .Values.logstash.kafkaBootstrap | quote }}
        topic_id          => {{ .Values.logstash.topic | quote }}
        message_key       => "%{trace_id}"
        codec             => json
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  labels:
    {{- include "logdemo-apps.labels" . | nindent 4 }}
    app.kubernetes.io/component: logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: logstash
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "logdemo-apps.labels" . | nindent 8 }}
        app.kubernetes.io/component: logstash
    spec:
      containers:
        - name: logstash
          image: {{ .Values.logstash.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp-in
              containerPort: {{ .Values.logstash.port }}
            - name: http-api
              containerPort: 9600
          env:
            - name: LS_JAVA_OPTS
              value: {{ .Values.logstash.javaOpts | default "-Xms512m -Xmx512m" | quote }}
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
            - name: pipeline
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
            - name: pipeline
              mountPath: /usr/share/logstash/config/pipelines.yml
              subPath: pipelines.yml
          readinessProbe:
            httpGet:
              path: /
              port: http-api
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http-api
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.logstash.resources | nindent 12 }}
      volumes:
        - name: pipeline
          configMap:
            name: logstash-pipeline
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  labels:
    {{- include "logdemo-apps.labels" . | nindent 4 }}
    app.kubernetes.io/component: logstash
spec:
  selector:
    app.kubernetes.io/component: logstash
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: tcp-in
      port: {{ .Values.logstash.port }}
      targetPort: tcp-in
{{- end }}

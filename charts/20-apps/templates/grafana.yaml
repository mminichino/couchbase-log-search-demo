{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    {{- include "logdemo-apps.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  couchbase.yaml: |
    apiVersion: 1
    datasources:
      - name: Couchbase
        uid: couchbase
        type: couchbase-datasource
        access: proxy
        isDefault: true
        editable: false
        jsonData:
          host: {{ .Values.grafana.couchbaseHost | quote }}
          username: {{ .Values.grafana.couchbaseUsername | quote }}
        secureJsonData:
          password: ${CB_PASSWORD}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  labels:
    {{- include "logdemo-apps.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: logdemo
        orgId: 1
        folder: Logdemo
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    {{- include "logdemo-apps.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
{{- $files := .Files.Glob "dashboards/*.json" }}
{{- if $files }}
{{- range $path, $bytes := $files }}
  {{ base $path }}: |
{{ $bytes | toString | indent 4 }}
{{- end }}
{{- else }}
  .keep: |
    {}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    {{- include "logdemo-apps.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.grafana.port | default 3000 }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    {{- include "logdemo-apps.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: grafana
    spec:
      containers:
        - name: grafana
          image: {{ printf "%s/%s" .Values.imageRegistry .Values.grafana.image | quote }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: {{ .Values.grafana.port | default 3000 }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.grafana.adminUser | default "admin" | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.adminPasswordSecret | default "grafana-admin" }}
                  key: password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            - name: GF_INSTALL_PLUGINS
              value: ""
            {{- if .Values.grafana.host }}
            - name: GF_SERVER_ROOT_URL
              value: {{ printf "%s://%s" (.Values.grafana.publicScheme | default "https") .Values.grafana.host | quote }}
            - name: GF_SERVER_DOMAIN
              value: {{ .Values.grafana.host | quote }}
            - name: GF_SERVER_ENFORCE_DOMAIN
              value: "false"
            {{- end }}
            - name: CB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.couchbasePasswordSecret | default "cb-user-grafana-ro" }}
                  key: password
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
{{- end }}

{{- if and .Values.discover.enabled .Values.discover.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: discover
  labels:
    {{- include "logdemo-apps.labels" . | nindent 4 }}
    app.kubernetes.io/component: discover
  annotations:
    haproxy.org/ssl-redirect: "true"
    haproxy.org/ssl-redirect-port: "443"
spec:
  ingressClassName: {{ .Values.ingress.className | default "haproxy" | quote }}
  tls:
    - hosts:
        - {{ .Values.discover.host | quote }}
      secretName: {{ .Values.discover.tlsSecretName | default "discover-tls" | quote }}
  rules:
    - host: {{ .Values.discover.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: discover
                port:
                  number: {{ .Values.discover.port }}
{{- end }}
